# Render Blueprint: New + > Blueprint, pick the GitHub repo. Secrets are typed in the dashboard.
services:
  - type: web
    name: nova-health-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: NOTIFY_PROVIDER
        value: log
      - key: ALLOWED_ORIGINS
        value: "*"
